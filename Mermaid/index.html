<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Avery's Mermaid Math</title>
<link rel="icon" href="mermaid-icon.png">
<link rel="apple-touch-icon" href="mermaid-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Avery Mermaid Math">
<meta name="theme-color" content="#3FB8DE">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#FF6FA5; --yellow:#FFB03A; --green:#57C88E; --blue:#A66BE0;
    --purple:#C36BE0; --orange:#FF9A5C;
    --sky1:#CDEDF5; --sky2:#E4D8F5;
    --ink:#2E2A55;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    touch-action:manipulation;
    font-family:'Fredoka','Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%,#FFF6DC);
    color:var(--ink);
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .hidden{display:none !important;}
  .screen{height:100dvh; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}

  /* ---------- START SCREEN ---------- */
  #startScreen{align-items:center; justify-content:center; gap:0;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);
    position:relative; overflow-y:auto; overflow-x:hidden; text-align:center;
    background:linear-gradient(180deg, rgba(14,30,66,.30), rgba(14,30,66,.55)),
      url("background.png") center/cover no-repeat,
      linear-gradient(180deg,#3FB8DE 0%,#2A6FB0 100%);
    background-attachment:scroll;}
  .entry-inner{display:flex; flex-direction:column; align-items:center; gap:14px;
    width:100%; max-width:520px; margin:auto;}
  .entry-inner>*{flex-shrink:0;}
  .cloud{position:absolute; width:14px; height:14px; border-radius:50%; opacity:.7;
    background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.95), rgba(255,255,255,.2) 60%, transparent);
    box-shadow:none;}
  .c1{left:16%; bottom:-20px; animation:riseUp 9s linear infinite;}
  .c2{left:78%; bottom:-20px; width:20px; height:20px; animation:riseUp 12s linear 3s infinite;}
  @keyframes riseUp{0%{transform:translateY(0);opacity:0;}12%{opacity:.7;}100%{transform:translateY(-110vh);opacity:0;}}
  .title-img{width:min(420px,86vw); height:auto; filter:drop-shadow(0 5px 12px rgba(10,25,60,.5));}
  .mermaid-wrap{animation:bob 4s ease-in-out infinite; will-change:transform; margin:-10px 0; line-height:0;}
  .mermaid-hero{width:min(392px,85vw); height:auto;}
  .name-banner{
    font-weight:700; font-size:20px; color:#5A3A16; letter-spacing:1px;
    background:linear-gradient(180deg,#FBE9C2,#EBD09A); padding:3px 26px; border-radius:8px;
    box-shadow:0 3px 0 rgba(120,90,40,.4); position:relative;}
  .name-banner:before,.name-banner:after{content:''; position:absolute; top:0; width:12px; height:100%;
    background:#D9B876;}
  .name-banner:before{left:-10px; clip-path:polygon(0 50%,100% 0,100% 100%);}
  .name-banner:after{right:-10px; clip-path:polygon(100% 50%,0 0,0 100%);}
  .game-title{
    font-size:clamp(30px,7vw,50px); line-height:.95; font-weight:700; letter-spacing:1px;
    color:#fff; text-shadow:0 3px 0 rgba(20,50,90,.3); margin-top:2px;
  }
  .game-title .rainbow{
    display:block; font-size:clamp(40px,10vw,68px);
    background:linear-gradient(90deg,#FFE07A,#7FE0D6,#5AC0E8,#C7A6F2,#F19AD0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 0 rgba(20,50,90,.28));
  }
  .sub-name{display:block; font-size:clamp(12px,3.2vw,15px); font-weight:600; letter-spacing:.5px;
    color:#EAFBFF; text-shadow:0 1px 0 rgba(20,50,90,.3);}
  .tagline{font-size:clamp(14px,3.6vw,18px); font-weight:600; color:#EAFBFF; text-shadow:0 1px 0 rgba(20,50,90,.25);}
  .top-score{background:#ffffffe0; border-radius:999px; padding:6px 18px; font-weight:700; font-size:16px;
    color:#8A5A00; box-shadow:0 3px 0 rgba(20,50,90,.18);}
  .intro-row{display:flex; align-items:flex-end; gap:6px; margin-top:2px;}
  .intro-bubble{background:#fff; border-radius:16px; padding:8px 14px; font-weight:600; font-size:15px; color:var(--ink);
    box-shadow:0 3px 0 rgba(20,50,90,.18); position:relative; margin-bottom:22px;}
  .intro-bubble:after{content:''; position:absolute; left:-8px; bottom:8px; border:9px solid transparent; border-right-color:#fff;}
  .picker-label{font-weight:700; font-size:15px; color:#EAFBFF; margin-top:2px; text-shadow:0 1px 0 rgba(20,50,90,.3);}
  .pts-hint{font-weight:600; font-size:12px; color:#FFE07A;}
  .ops-picker{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .op{font-family:inherit; font-size:15px; font-weight:700; padding:8px 14px; border:none; border-radius:12px;
    background:#ffffffcc; color:#7C93A8; cursor:pointer; box-shadow:0 3px 0 rgba(20,50,90,.18); transition:transform .1s,background .15s,color .15s;}
  .op:active{transform:translateY(2px);}
  .op.on{background:var(--green); color:#fff; box-shadow:0 3px 0 #2f9e6a;}
  .table-picker{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:min(320px,86vw);}
  .chip{
    font-family:inherit; font-size:20px; font-weight:700; padding:10px 0; border:none; border-radius:14px;
    background:#fff; color:#C9A5BC; cursor:pointer; box-shadow:0 3px 0 rgba(36,59,83,.15);
    transition:transform .1s, background .15s, color .15s;
  }
  .chip:active{transform:translateY(2px);}
  .chip.on{background:var(--blue); color:#fff; box-shadow:0 3px 0 #7d47b8;}
  .chip-all{
    font-family:inherit; font-size:14px; font-weight:600; padding:7px 16px; border:none; border-radius:999px;
    background:#ffffffcc; color:#39668a; cursor:pointer;
  }
  .speed-picker{display:flex; gap:7px;}
  .spd{
    font-family:inherit; font-size:17px; font-weight:700; padding:7px 13px; border:none; border-radius:14px;
    background:#fff; color:#8fb0c4; cursor:pointer; box-shadow:0 3px 0 rgba(20,50,90,.18);
    transition:transform .1s, background .15s, color .15s; display:flex; flex-direction:column; align-items:center; line-height:1;
  }
  .spd small{font-size:10px; font-weight:700; opacity:.85; margin-top:2px;}
  .spd:active{transform:translateY(2px);}
  .spd.on{background:var(--blue); color:#fff; box-shadow:0 3px 0 #7d47b8;}
  .spd.lightning.on{background:linear-gradient(180deg,#FFD54A,#FF9A2E); color:#5A3200; box-shadow:0 3px 0 #d97a1e;}
  .start-btn{
    font-family:inherit; font-size:26px; font-weight:700; letter-spacing:1px; color:#fff;
    background:linear-gradient(180deg,var(--red),#E63E50); border:none; border-radius:20px;
    padding:14px 44px; cursor:pointer; box-shadow:0 5px 0 #B22638; margin-top:4px;
    transition:transform .1s;
  }
  .start-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #B22638;}
  .start-btn:disabled{filter:grayscale(1); opacity:.55; cursor:not-allowed;}
  .howto{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:440px; margin-top:6px;}
  .howto span{background:#ffffffb8; border-radius:12px; padding:6px 10px; font-size:12.5px; font-weight:600; color:#9C5F86;}

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{gap:0; width:100%; max-width:600px; margin:0 auto;}
  header{
    display:flex; align-items:center; gap:6px; padding:8px 10px;
  }
  header .stat{
    background:#ffffffd9; border-radius:12px; padding:5px 10px; font-weight:700; font-size:15px;
    box-shadow:0 2px 0 rgba(36,59,83,.12); white-space:nowrap;
  }
  header .spacer{flex:1;}
  .icon-btn{
    font-family:inherit; font-size:18px; background:#ffffffd9; border:none; border-radius:12px;
    padding:5px 10px; cursor:pointer; box-shadow:0 2px 0 rgba(36,59,83,.12); position:relative;
  }
  .icon-btn.off{opacity:.55;}
  .icon-btn.off:after{content:''; position:absolute; left:6px; right:6px; top:50%; height:3px;
    background:#E63E50; border-radius:2px; transform:rotate(-20deg);}
  #track{
    position:relative; height:46px; margin:2px 10px 6px; border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,#6FD3EC,#3EA9DA);
    box-shadow:inset 0 3px 6px rgba(255,255,255,.4);
  }
  #track:before{content:''; position:absolute; left:0; right:0; top:50%; height:8px; transform:translateY(-50%);
    background:repeating-radial-gradient(circle at 4px 4px, rgba(255,255,255,.85) 0 3px, transparent 3px 13px);
    background-size:22px 8px; opacity:.9;}
  .finish{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:24px;}
  #car{position:absolute; left:6px; top:50%; transform:translateY(-50%); font-size:30px;
    transition:left .45s cubic-bezier(.34,1.4,.5,1); filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
  #car.hop{animation:hop .5s ease;}
  @keyframes hop{30%{transform:translateY(-70%) rotate(-8deg);} 60%{transform:translateY(-45%) rotate(4deg);}}

  #playfield{
    position:relative; flex:1; margin:0 10px; border-radius:20px; overflow:hidden;
    background:linear-gradient(180deg,#3FB8DE,#2A6FB0);
    box-shadow:inset 0 0 0 3px #ffffffcc;
  }
  #scene{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; z-index:0; pointer-events:none;}
  /* soft light veil so falling tiles stay readable over the busy scene */
  #playfield:after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 34%, rgba(255,255,255,0) 70%, rgba(20,60,110,.14));}
  #wall,#ghost,.falling-brick,.puppy-corner{z-index:3;}
  .falling-brick{z-index:5;}
  .puppy-corner{z-index:6;}
  .weed{transform-origin:bottom center; animation:sway 4s ease-in-out infinite;}
  .weed.d1{animation-delay:.6s;} .weed.d2{animation-delay:1.2s;}
  @keyframes sway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
  .drift{animation:driftY 6s ease-in-out infinite;}
  .drift.d1{animation-delay:1.4s; animation-duration:7s;}
  .drift.d2{animation-delay:2.6s; animation-duration:8s;}
  @keyframes driftY{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .bubbles{position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden;}
  .bubbles span{position:absolute; bottom:-24px; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 60%, rgba(255,255,255,.08));
    box-shadow:inset 0 0 3px rgba(255,255,255,.6); animation:rise-bub linear infinite;}
  .bubbles span:nth-child(1){left:12%; width:9px; height:9px; animation-duration:7s; animation-delay:0s;}
  .bubbles span:nth-child(2){left:26%; width:14px; height:14px; animation-duration:9s; animation-delay:1.5s;}
  .bubbles span:nth-child(3){left:44%; width:7px; height:7px; animation-duration:6s; animation-delay:3s;}
  .bubbles span:nth-child(4){left:58%; width:12px; height:12px; animation-duration:8.5s; animation-delay:.8s;}
  .bubbles span:nth-child(5){left:72%; width:8px; height:8px; animation-duration:7.5s; animation-delay:2.2s;}
  .bubbles span:nth-child(6){left:86%; width:15px; height:15px; animation-duration:10s; animation-delay:4s;}
  .bubbles span:nth-child(7){left:35%; width:6px; height:6px; animation-duration:6.5s; animation-delay:5s;}
  @keyframes rise-bub{0%{transform:translateY(0) translateX(0); opacity:0;}
    12%{opacity:.85;} 90%{opacity:.7;}
    100%{transform:translateY(-108%) translateX(10px); opacity:0;}}
  #wall{position:absolute; inset:0; pointer-events:none;}
  .wbrick{
    position:absolute; border-radius:12px;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.45), 0 1px 2px rgba(107,59,94,.18);
  }
  .wbrick.junk{background:#8FA9B8;}
  .wbrick.junk:after{content:'🪨'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; opacity:.75;}
  .wbrick.clearing{animation:clearFlash .4s ease forwards;}
  @keyframes clearFlash{
    40%{background:#fff; transform:scale(1.12); box-shadow:0 0 18px #fff;}
    100%{opacity:0; transform:scale(.4) rotate(20deg);}
  }
  #ghost{position:absolute; display:none; border:2.5px dashed rgba(228,138,212,.6); border-radius:12px; pointer-events:none;}
  .falling-brick{
    position:absolute; top:0; left:0; transform:translateY(-60px);
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.5), 0 4px 8px rgba(107,59,94,.22);
    z-index:5;
  }
  .falling-brick:before{content:''; position:absolute; top:6px; left:14px; right:14px; height:9px;
    background:radial-gradient(ellipse 8px 5px at 8px 4px, rgba(255,255,255,.6) 60%, transparent 62%);
    background-size:22px 9px; background-repeat:repeat-x;}
  .falling-brick .ptext{
    font-size:24px; font-weight:700; color:#fff; text-shadow:0 2px 0 rgba(120,60,100,.3);
    transition:font-size .3s;
  }
  .falling-brick.locking{transition:left .36s ease, top .36s ease, width .36s ease, height .36s ease, background .36s;}
  .falling-brick.locking:before{opacity:0;}
  .falling-brick.locking .ptext{font-size:12px;}
  .falling-brick.shake{animation:shakeX .5s ease 2;}
  @keyframes shakeX{20%{transform:translateX(-7px) translateY(var(--fy,0));}40%{transform:translateX(7px) translateY(var(--fy,0));}
    60%{transform:translateX(-5px) translateY(var(--fy,0));}80%{transform:translateX(5px) translateY(var(--fy,0));}}

  .puppy-corner{position:absolute; left:8px; bottom:6px; width:92px; pointer-events:none; z-index:6;}
  .coach-anim{animation:bob 3s ease-in-out infinite; will-change:transform;}
  .puppy-corner svg{width:88px; height:88px;}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-2deg);}}

  /* On phones and tablets, keep the mermaid and crab perfectly still.
     iPhone Safari re-renders moving artwork each frame and stutters,
     so on touch devices there is no float, twirl, or layer promotion. */
  @media (hover: none) and (pointer: coarse){
    .mermaid-wrap, .coach-anim, .striker{
      animation:none !important;
      will-change:auto !important;
      transform:none !important;
    }
  }
  .bubble{
    position:absolute; bottom:92px; left:0; min-width:150px; max-width:220px;
    background:#fff; border-radius:14px; padding:8px 12px; font-size:14px; font-weight:600; color:var(--ink);
    box-shadow:0 3px 0 rgba(36,59,83,.15); opacity:0; transform:translateY(8px) scale(.9); transform-origin:bottom left;
    transition:opacity .2s, transform .2s;
  }
  .bubble:after{content:''; position:absolute; left:22px; bottom:-14px; border:8px solid transparent; border-top-color:#fff;}
  .bubble.show{opacity:1; transform:translateY(0) scale(1);}

  .score-pop{
    position:absolute; z-index:7; font-weight:700; font-size:20px; color:var(--green);
    text-shadow:0 2px 0 #fff; transform:translateX(-50%); animation:rise .9s ease forwards; pointer-events:none;
  }
  @keyframes rise{to{transform:translate(-50%,-46px); opacity:0;}}

  #toast{
    position:fixed; top:16%; left:50%; transform:translateX(-50%); z-index:40;
    font-size:clamp(22px,6vw,34px); font-weight:700; color:#fff; letter-spacing:1px;
    text-shadow:0 3px 0 rgba(36,59,83,.35); opacity:0; pointer-events:none; white-space:nowrap;
  }
  #toast.pop{animation:toastPop 1.5s ease forwards;}
  @keyframes toastPop{
    10%{opacity:1; transform:translateX(-50%) scale(1.15);}
    25%{transform:translateX(-50%) scale(1);}
    80%{opacity:1;}
    100%{opacity:0; transform:translateX(-50%) translateY(-20px);}
  }

  #answers{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px;
  }
  .ans{
    position:relative; font-family:inherit; font-size:30px; font-weight:700; color:#fff;
    border:none; border-radius:16px; padding:16px 0 12px; cursor:pointer;
    text-shadow:0 2px 0 rgba(36,59,83,.3);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.35), 0 4px 0 rgba(36,59,83,.22);
    transition:transform .08s;
  }
  .ans:before{content:''; position:absolute; top:5px; left:16px; right:16px; height:9px;
    background:radial-gradient(circle at 5px 4px, rgba(255,255,255,.5) 4px, transparent 5px);
    background-size:22px 9px; background-repeat:repeat-x;}
  .ans:active{transform:translateY(3px);}
  .a0{background:var(--red);} .a1{background:var(--yellow);} .a2{background:var(--green);} .a3{background:var(--blue);}
  .ans.right{box-shadow:0 0 0 4px #fff, 0 0 22px #7CF7B0, inset 0 -6px 0 rgba(0,0,0,.18); transform:scale(1.04);}
  .ans.wrong{animation:shakeBtn .4s ease; filter:saturate(.4) brightness(.85);}
  @keyframes shakeBtn{25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-4px);}}
  .ans:disabled{cursor:default;}

  .confetti{
    position:fixed; top:-14px; width:9px; height:14px; border-radius:2px; z-index:60; pointer-events:none;
    animation:confFall 1.4s linear forwards;
  }
  @keyframes confFall{to{transform:translateY(106vh) rotate(560deg);}}

  /* ---------- TREASURE CELEBRATION OVERLAY ---------- */
  .overlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(20,50,90,.5); backdrop-filter:blur(2px);}
  .pitch{
    position:relative; width:min(92vw,360px); height:min(78dvh,470px); border-radius:26px; overflow:hidden;
    background:linear-gradient(180deg,#7FE0F0 0%,#3FB8DE 50%,#2A6FB0 78%,#E3C98C 78%,#D8B466 100%);
    box-shadow:0 10px 40px rgba(20,50,90,.5);
  }
  /* radiant light burst behind the mermaid */
  .goal-frame{
    position:absolute; top:34px; left:50%; transform:translateX(-50%);
    width:220px; height:220px; border:none; border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,160,.85), rgba(255,240,160,0) 62%);
  }
  .goal-frame.go{animation:burstPulse 2.4s ease .6s infinite;}
  @keyframes burstPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.85;}50%{transform:translateX(-50%) scale(1.12);opacity:1;}}
  .striker{position:absolute; left:50%; bottom:6px; margin-left:-95px; width:190px; height:auto; z-index:2;
    animation:twirl 3s ease-in-out infinite;}
  @keyframes twirl{0%,100%{transform:rotate(-4deg) translateY(0);}50%{transform:rotate(4deg) translateY(-6px);}}
  .ball{position:absolute; left:calc(50% - 17px); bottom:60px; font-size:34px; opacity:0; z-index:3;}
  .ball.go{animation:ballFly 1s cubic-bezier(.3,.6,.4,1) forwards;}
  @keyframes ballFly{
    0%{opacity:1; transform:translate(0,0) rotate(0) scale(.5);}
    100%{opacity:1; transform:translate(0,-232px) rotate(360deg) scale(1.5);}
  }
  .goal-text{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) scale(0); z-index:4;
    font-size:44px; font-weight:700; color:#fff; letter-spacing:1px;
    text-shadow:0 4px 0 rgba(20,50,90,.55); white-space:nowrap;
  }
  .goal-text.go{animation:goalPop 2s cubic-bezier(.34,1.5,.5,1) 1s forwards;}
  @keyframes goalPop{20%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);}
    35%{transform:translate(-50%,-50%) scale(1) rotate(2deg);}
    100%{transform:translate(-50%,-50%) scale(1);}}
  .goal-sub{
    position:absolute; bottom:16px; left:0; right:0; text-align:center; z-index:4;
    font-size:16px; font-weight:700; color:#4a3410; text-shadow:0 2px 0 rgba(255,255,255,.5); padding:0 12px;
  }

  @media (max-height:620px){
    .falling-brick .ptext{font-size:20px;}
    .ans{font-size:24px; padding:12px 0 9px;}
    #track{height:38px;} #car{font-size:24px;} .finish{font-size:19px;}
  }
  @media (orientation:landscape) and (max-height:540px){
    #startScreen{justify-content:flex-start; overflow-y:auto; gap:10px;}
    #gameScreen{
      max-width:none; margin:0; display:grid;
      grid-template-columns:minmax(0,1fr) minmax(210px,300px);
      grid-template-rows:auto auto minmax(0,1fr);
      column-gap:10px;
      padding-left:env(safe-area-inset-left,0px);
      padding-right:calc(env(safe-area-inset-right,0px) + 10px);
    }
    header{grid-column:1/3;}
    #track{grid-column:1; grid-row:2; margin:2px 0 6px 10px;}
    #playfield{grid-column:1; grid-row:3; margin:0 0 10px 10px;}

  @media (prefers-reduced-motion:reduce){

  }
</style>
</head>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var COLS=8;
var PALETTE=['#FF6FA5','#FFB03A','#57C88E','#A66BE0','#33C6D6','#FF9A5C'];
var PRAISE=['Yay Avery!','Splash-tastic! 🌊','Pearl-fect! 🦪','You did it, Avery!','Super smart!','Bubbly! 🫧','Nice catch!','Fin-five! 🐠','Making waves! 🌊'];
var STREAKMSG={3:'✨ 3 in a row!',5:'🐚 5 in a row! Wow!',7:'Amazing, Avery! ✨',10:'MERMAID MAGIC! 🧜‍♀️💎',15:'Queen of the sea! 👑'};

var tables=new Set([2,3,4,5,6,7,8,9,10]);
var muted=false, actx=null;
var gen=0;
var S=null;
/* falling speed: 1 gentle, 2 normal, 3 zippy — base fall time in ms */
var speed=1;
var SPEED_BASE={1:15000,2:11500,3:8000,4:5200};
var SPEED_FLOOR={1:8000,2:5500,3:3600,4:2600};
var SPEED_ICON={1:'🐢1',2:'🐟2',3:'🐬3',4:'⚡4'};
var SPEED_MULT={1:1,2:2,3:3,4:5};   /* faster mode = more points per answer */
var ops=new Set(['×','÷','+','−']);  /* all operations on by default */

/* ---------- top score (browser storage with in-memory fallback) ---------- */
var mem={};
var store={
  get:function(k){
    try{ var v=window.localStorage.getItem(k); if(v!==null) return v; }catch(e){}
    return (k in mem)?mem[k]:null;
  },
  set:function(k,v){
    mem[k]=v;
    try{ window.localStorage.setItem(k,v); }catch(e){}
  }
};
var TOP_KEY='avery-mermaid-top';
var topScore=parseInt(store.get(TOP_KEY),10)||0;
function saveTop(){ store.set(TOP_KEY,String(topScore)); }
var SPEED_KEY='avery-mermaid-speed';
var savedSpeed=parseInt(store.get(SPEED_KEY),10);
if(savedSpeed>=1&&savedSpeed<=3) speed=savedSpeed;
function showTop(){
  var box=$('topScoreBox');
  if(topScore>0){
    $('topScoreVal').textContent=topScore;
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
}

var playfield=$('playfield'), wallEl=$('wall'), fb=$('fallingBrick'), ghost=$('ghost'),
    answersEl=$('answers'), car=$('car');

function later(ms,fn){ var g=gen; setTimeout(function(){ if(g===gen) fn(); },ms); }

function freshState(){
  var stacks=[]; for(var i=0;i<COLS;i++) stacks.push([]);
  return {score:0,streak:0,goals:0,correct:0,wrong:0,bricks:0,
    stacks:stacks, missed:[], last:null, choices:[],
    phase:'idle', cur:null, col:0, fallStart:0, fallDur:11500, raf:0, pausedAt:0, lastY:0,
    recordToasted:false};
}
function level(){ return Math.floor(S.correct/8)+1; }

/* ---------- sound ---------- */
function ensureAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==='suspended'){ actx.resume(); }
}
function tone(f,d,type,delay,vol){
  if(muted||!actx) return;
  var t=actx.currentTime+(delay||0);
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.11,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+d);
}
var snd={
  click:function(){ tone(430,.07,'triangle'); },
  good:function(){ tone(660,.1,'triangle'); tone(880,.15,'triangle',.09); },
  bad:function(){ tone(185,.3,'sawtooth',0,.06); },
  clear:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.13,'triangle',i*.07); }); },
  lap:function(){ tone(440,.12,'square',0,.07); tone(440,.12,'square',.16,.07); },
  goal:function(){ [392,392,392,523,659,784].forEach(function(f,i){ tone(f,i<3?.12:.24,'triangle',i*.14); }); }
};

/* ---------- background music: original tune, platformer rhythm played balalaika style ---------- */
var musicOn=true, musicTimer=null, musicGain=null, nextNoteTime=0, musicStep=0, noiseBuf=null, lastMel=69;
var STEP=60/170/2; /* eighth notes at a zippy 170 bpm */
/* melody markers: number = strike note, -1 = keep tremolo on previous note, null = rest */
var HOOKA=[
  76,-1,72,null, 74,72,null,71,
  69,null,72,74, 76,-1,null,74,
  77,-1,74,null, 77,79,null,77,
  76,74,71,null, 80,-1,71,null
];
var HOOKB=[
  null,76,81,null, 79,-1,77,76,
  74,-1,79,null, 74,71,null,74,
  71,-1,68,null, 71,74,76,-1,
  77,76,74,72, 69,-1,-1,null
];
var ROOTSA=[45,45,50,40]; /* Am Am Dm E */
var ROOTSB=[45,43,40,45]; /* Am G  E  Am */
var CHORDS={45:[60,64,69],50:[62,65,69],40:[59,64,68],43:[59,62,67]};
var SCALE=[0,2,4,5,8,9,11]; /* A harmonic minor pitch classes */
function thirdBelow(m){
  var pc=((m%12)+12)%12;
  var ix=SCALE.indexOf(pc);
  if(ix<0) return m-3;
  var drop=(pc-SCALE[(ix+5)%7]+12)%12;
  return m-drop;
}
function midiF(m){ return 440*Math.pow(2,(m-69)/12); }
function mnote(m,t,d,type,vol){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=midiF(m);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t+d+0.05);
}
function balaNote(m,t,vol){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type='sawtooth'; o.frequency.value=midiF(m);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+STEP*0.48);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t+STEP*0.6);
}
function strum(tones,t){
  tones.forEach(function(m,i){ balaNote(m,t+i*0.014,0.016); });
}
function getNoise(){
  if(!noiseBuf){
    noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*0.1),actx.sampleRate);
    var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function hat(t,vol){
  var s=actx.createBufferSource(); s.buffer=getNoise();
  var f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6500;
  var g=actx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  s.connect(f); f.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t+0.05);
}
function kick(t){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(130,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.10,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t+0.16);
}
function snare(t){
  var s=actx.createBufferSource(); s.buffer=getNoise();
  var f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.8;
  var g=actx.createGain();
  g.gain.setValueAtTime(0.05,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  s.connect(f); f.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t+0.1);
}
function scheduleMusic(){
  if(!actx) return;
  while(nextNoteTime<actx.currentTime+0.4){
    var t=nextNoteTime;
    var half=Math.floor(musicStep/32)%2;
    var pat=half?HOOKB:HOOKA;
    var roots=half?ROOTSB:ROOTSA;
    var loopPos=musicStep%32;
    var bar=Math.floor(loopPos/8);
    var pos=loopPos%8;
    var root=roots[bar];
    /* platformer rhythm bed: ticking hats, thump on 1, snap on 3 */
    hat(t,(pos%2===1)?0.05:0.03);
    if(pos===0) kick(t);
    if(pos===4) snare(t);
    /* bouncing staccato bass on the beats, strummed chords on the offbeats */
    if(pos%2===0){
      mnote(pos%4===0?root:root+12,t,STEP*0.5,'triangle',0.11);
    } else {
      strum(CHORDS[root]||[],t);
    }
    /* balalaika lead: every note struck twice, holds keep shimmering, harmony a third below */
    var n=pat[loopPos];
    if(n===-1){
      balaNote(lastMel,t,0.032);
      balaNote(lastMel,t+STEP/2,0.026);
    } else if(n){
      lastMel=n;
      balaNote(n,t,0.052);
      balaNote(n,t+STEP/2,0.034);
      balaNote(thirdBelow(n),t,0.02);
    }
    nextNoteTime+=STEP;
    musicStep++;
  }
}
function musicVolume(){ return (muted||!musicOn)?0:0.5; }
function setMusicVolume(){
  if(musicGain&&actx) musicGain.gain.setTargetAtTime(musicVolume(),actx.currentTime,0.05);
}
function startMusic(){
  if(musicTimer||!actx) return;
  if(!musicGain){ musicGain=actx.createGain(); musicGain.connect(actx.destination); }
  musicGain.gain.value=musicVolume();
  nextNoteTime=actx.currentTime+0.1;
  musicTimer=setInterval(scheduleMusic,150);
}
function stopMusic(){
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
}

/* ---------- geometry ---------- */
function metrics(){
  var r=playfield.getBoundingClientRect();
  var cw=r.width/COLS;
  var bh=Math.max(22,Math.min(34,r.height/9));
  return {W:r.width,H:r.height,cw:cw,bh:bh};
}

/* ---------- wall ---------- */
function renderWall(){
  var m=metrics();
  wallEl.innerHTML='';
  S.stacks.forEach(function(stack,c){
    stack.forEach(function(b,r){
      var d=document.createElement('div');
      d.className='wbrick'+(b.junk?' junk':'');
      d.dataset.row=r;
      d.style.left=(c*m.cw+2)+'px';
      d.style.bottom=(r*m.bh+2)+'px';
      d.style.width=(m.cw-4)+'px';
      d.style.height=(m.bh-4)+'px';
      if(!b.junk) d.style.background=b.color;
      wallEl.appendChild(d);
    });
  });
}

/* ---------- problems ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function rint(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function buildProblem(){
  var active=Array.from(ops);
  if(!active.length) active=['×'];
  var op=active[Math.floor(Math.random()*active.length)];
  var a,b,ans;
  if(op==='×'){
    var arr=Array.from(tables); if(!arr.length) arr=[2,3,4,5,6,7,8,9,10];
    a=arr[Math.floor(Math.random()*arr.length)];
    b=rint(1,10); ans=a*b;
  } else if(op==='+'){
    a=rint(2,19); b=rint(2,Math.min(19,22-a>2?22-a:9)); ans=a+b;
  } else if(op==='−'){ /* subtraction, no negative answers */
    a=rint(4,20); b=rint(1,a-1); ans=a-b;
  } else { /* division, whole-number answers only */
    b=rint(2,10); ans=rint(1,10); a=b*ans;
  }
  return {a:a,b:b,op:op,ans:ans,text:a+' '+op+' '+b};
}
function nextProblem(){
  var p=null;
  if(S.missed.length&&Math.random()<0.45) p=S.missed.shift();
  if(!p){
    for(var i=0;i<8;i++){
      p=buildProblem();
      if(!S.last||S.last.text!==p.text) break;
    }
  }
  S.last=p;
  return p;
}
function ans_off(c){return c+ (Math.random()<0.5?4:-4);}
function makeChoices(p){
  var a=p.a,b=p.b,c=p.ans,cands;
  if(p.op==='×') cands=[(a+1)*b,(a-1)*b,a*(b+1),a*(b-1),c+a,c-a,c+b,c-b,c+10,c-10,c+2,c-2];
  else if(p.op==='+') cands=[c+1,c-1,c+2,c-2,Math.abs(a-b),c+10,c-10,a,b,c+3,c-3];
  else if(p.op==='−') cands=[c+1,c-1,c+2,c-2,a+b,c+10,b,a,c+3,c-3,b-a];
  else cands=[c+1,c-1,c+2,c-2,b,c+3,c-3,c+5,ans_off(c),a-b,b+c];
  cands=shuffle(cands);
  var set=[c];
  for(var i=0;i<cands.length&&set.length<4;i++){
    var v=cands[i];
    if(v>0&&set.indexOf(v)===-1) set.push(v);
  }
  while(set.length<4){
    var w=c+2+Math.floor(Math.random()*12);
    if(set.indexOf(w)===-1) set.push(w);
  }
  return shuffle(set);
}
function pickColumn(){
  var hs=S.stacks.map(function(s){return s.length;});
  var min=Math.min.apply(null,hs);
  var opts=[];
  hs.forEach(function(h,i){ if(h<=min+1) opts.push(i); });
  return opts[Math.floor(Math.random()*opts.length)];
}

/* ---------- falling ---------- */
function spawn(){
  if(S.phase==='done') return;
  S.cur=nextProblem();
  S.col=pickColumn();
  S.choices=makeChoices(S.cur);
  var m=metrics();
  var bw=Math.min(150,m.W*0.42), fbH=54;
  var cx=S.col*m.cw+m.cw/2;
  var left=Math.max(4,Math.min(m.W-bw-4,cx-bw/2));
  fb.style.width=bw+'px'; fb.style.height=fbH+'px';
  fb.style.left=left+'px'; fb.style.top='0px';
  fb.style.transform='translateY(-60px)';
  fb.style.background=PALETTE[S.bricks%PALETTE.length];
  fb.className='falling-brick';
  fb.querySelector('.ptext').textContent=S.cur.text;
  ghost.style.display='block';
  ghost.style.left=(S.col*m.cw+2)+'px';
  ghost.style.width=(m.cw-4)+'px';
  ghost.style.height=(m.bh-4)+'px';
  ghost.style.bottom=(S.stacks[S.col].length*m.bh+2)+'px';
  var btns=answersEl.children;
  for(var i=0;i<4;i++){
    btns[i].textContent=S.choices[i];
    btns[i].className='ans a'+i;
    btns[i].disabled=false;
  }
  S.fallDur=Math.max(SPEED_FLOOR[speed],SPEED_BASE[speed]-(level()-1)*900);
  S.fallStart=performance.now();
  S.phase='falling';
  S.raf=requestAnimationFrame(fall);
}
function fall(t){
  if(S.phase!=='falling') return;
  var m=metrics();
  var fbH=parseFloat(fb.style.height)||54;
  var landTop=m.H-S.stacks[S.col].length*m.bh-fbH;
  var p=(t-S.fallStart)/S.fallDur;
  if(p>=1){ S.lastY=landTop; missTimeout(); return; }
  var y=-60+p*(landTop+60);
  S.lastY=y;
  fb.style.setProperty('--fy',y+'px');
  fb.style.transform='translateY('+y+'px) rotate('+(Math.sin(t/320)*2)+'deg)';
  S.raf=requestAnimationFrame(fall);
}
function stopFall(){ cancelAnimationFrame(S.raf); }
function freezeBrick(){
  fb.style.top=(S.lastY||0)+'px';
  fb.style.transform='none';
  fb.style.setProperty('--fy','0px');
}

/* ---------- answering ---------- */
answersEl.addEventListener('click',function(e){
  var b=e.target.closest('button.ans');
  if(!b||!S||S.phase!=='falling') return;
  ensureAudio();
  var val=parseInt(b.textContent,10);
  if(val===S.cur.ans) onCorrect(b); else onWrong(b);
});
function disableAns(){
  Array.prototype.forEach.call(answersEl.children,function(b){ b.disabled=true; });
}
function markCorrectBtn(){
  var c=S.cur.ans;
  Array.prototype.forEach.call(answersEl.children,function(b){
    if(parseInt(b.textContent,10)===c) b.classList.add('right');
  });
}
function onCorrect(btn){
  stopFall(); S.phase='locking';
  btn.classList.add('right');
  disableAns();
  S.streak++;
  var gain=(10+2*(S.streak-1))*SPEED_MULT[speed];
  S.score+=gain; S.correct++;
  popScore('+'+gain);
  snd.good();
  updateHud();
  moveCar();
  say(STREAKMSG[S.streak]||PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  lockBrick(false,function(){ afterLock(true); });
}
function onWrong(btn){
  stopFall(); S.phase='reveal';
  btn.classList.add('wrong');
  markCorrectBtn(); disableAns();
  S.streak=0; S.wrong++;
  S.missed.push(S.cur);
  snd.bad(); updateHud();
  revealThenLock('Almost!');
}
function missTimeout(){
  stopFall(); S.phase='reveal';
  markCorrectBtn(); disableAns();
  S.streak=0; S.wrong++;
  S.missed.push(S.cur);
  snd.bad(); updateHud();
  revealThenLock('⏰ Time flew!');
}
function revealThenLock(prefix){
  var c=S.cur.ans, full=S.cur.text+' = '+c;
  freezeBrick();
  fb.querySelector('.ptext').textContent=full;
  fb.classList.add('shake');
  say(prefix+' '+full+'. You can do it, Avery! 🧜‍♀️');
  later(1400,function(){
    fb.classList.remove('shake');
    S.phase='locking';
    lockBrick(true,function(){ afterLock(false); });
  });
}
function lockBrick(junk,cb){
  var m=metrics();
  freezeBrick();
  ghost.style.display='none';
  void fb.offsetWidth;
  fb.classList.add('locking');
  fb.style.left=(S.col*m.cw+2)+'px';
  fb.style.top=(m.H-(S.stacks[S.col].length+1)*m.bh+2)+'px';
  fb.style.width=(m.cw-4)+'px';
  fb.style.height=(m.bh-4)+'px';
  if(junk){ fb.style.background='#9AA6B5'; }
  else{ fb.querySelector('.ptext').textContent=S.cur.ans; }
  var color=junk?null:fb.style.background;
  later(390,function(){
    S.bricks++;
    S.stacks[S.col].push(junk?{junk:true}:{color:color});
    fb.classList.remove('locking');
    fb.style.transform='translateY(-60px)'; fb.style.top='0px';
    renderWall();
    checkLines(cb);
  });
}
function checkLines(cb){
  var hs=S.stacks.map(function(s){return s.length;});
  var n=Math.min.apply(null,hs);
  if(n<=0){ if(cb)cb(); return; }
  Array.prototype.forEach.call(wallEl.children,function(d){
    if(+d.dataset.row<n) d.classList.add('clearing');
  });
  snd.clear();
  later(430,function(){
    S.stacks.forEach(function(s){ s.splice(0,n); });
    var bonus=50*n;
    S.score+=bonus;
    updateHud();
    toast('🫧 BUBBLE CLEAR! +'+bonus);
    confetti(16);
    renderWall();
    if(cb)cb();
  });
}
function afterLock(wasCorrect){
  if(S.phase==='done') return;
  if(wasCorrect&&S.correct%10===0){ showGoal(); return; }
  S.phase='idle';
  later(350,spawn);
}

/* ---------- car & goal ---------- */
function moveCar(){
  var lapPos=S.correct%8;
  var tw=$('track').getBoundingClientRect().width;
  var usable=Math.max(40,tw-72);
  if(lapPos===0&&S.correct>0){
    car.style.left=usable+'px';
    snd.lap();
    toast('🐢 SWIM '+level()+'! A little faster!');
    car.classList.add('hop');
    later(850,function(){
      car.classList.remove('hop');
      car.style.transition='none';
      car.style.left='6px';
      void car.offsetWidth;
      car.style.transition='';
    });
  } else {
    car.style.left=(6+lapPos/8*usable)+'px';
  }
}
function showGoal(){
  S.phase='goal';
  S.goals++; updateHud();
  var ov=$('goalOverlay');
  $('goalSub').textContent='Treasure '+S.goals+' for Avery! 💎 Avery found a pearl!';
  ov.classList.remove('hidden');
  ['goalBall','goalText','goalNet'].forEach(function(id){
    var el=$(id); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  });
  snd.goal();
  later(1000,function(){ confetti(28); });
  later(3200,function(){
    ov.classList.add('hidden');
    S.phase='idle';
    later(300,spawn);
  });
}

/* ---------- feedback bits ---------- */
function updateHud(){
  $('score').textContent=S.score;
  $('streak').textContent=S.streak;
  $('goals').textContent=S.goals;
  $('level').textContent=level();
  if(S.score>topScore){
    var hadRecord=topScore>0;
    topScore=S.score;
    saveTop();
    if(hadRecord&&!S.recordToasted){
      S.recordToasted=true;
      toast('🏆 NEW TOP SCORE!');
      confetti(22);
    }
  }
}
var sayTimer=0;
function say(t){
  var b=$('bubble');
  b.textContent=t;
  b.classList.add('show');
  clearTimeout(sayTimer);
  sayTimer=setTimeout(function(){ b.classList.remove('show'); },2700);
}
function toast(t){
  var el=$('toast');
  el.textContent=t;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}
function popScore(t){
  var el=document.createElement('div');
  el.className='score-pop';
  el.textContent=t;
  var r=fb.getBoundingClientRect(), pr=playfield.getBoundingClientRect();
  el.style.left=(r.left-pr.left+r.width/2)+'px';
  el.style.top=Math.max(6,(r.top-pr.top))+'px';
  playfield.appendChild(el);
  setTimeout(function(){ el.remove(); },950);
}
function confetti(n){
  for(var i=0;i<n;i++){
    var c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=PALETTE[i%PALETTE.length];
    c.style.animationDuration=(0.9+Math.random()*0.9)+'s';
    c.style.animationDelay=(Math.random()*0.35)+'s';
    document.body.appendChild(c);
    setTimeout(function(el){ return function(){ el.remove(); }; }(c),2400);
  }
}

/* ---------- screens & controls ---------- */
/* Math operations (×, ÷, +, −) and all times tables are on by default,
   so there is no picker to build or wire on the entry page. */
function applySpeed(v){
  speed=v;
  store.set(SPEED_KEY,String(v));
  Array.prototype.forEach.call($('speedPicker').children,function(b){
    b.classList.toggle('on',+b.dataset.spd===v);
  });
  $('speedBtn').textContent=SPEED_ICON[v];
  /* if a petal is mid-fall, retime the rest of its drop to the new speed */
  if(S&&S.phase==='falling'){
    var now=performance.now();
    var elapsed=now-S.fallStart;
    var progressed=elapsed/S.fallDur;              /* fraction already fallen */
    var newDur=Math.max(SPEED_FLOOR[speed],SPEED_BASE[speed]-(level()-1)*900);
    S.fallDur=newDur;
    S.fallStart=now-progressed*newDur;             /* keep the petal where it is */
  }
}
$('speedPicker').addEventListener('click',function(e){
  var b=e.target.closest('.spd'); if(!b) return;
  ensureAudio(); snd.click();
  applySpeed(+b.dataset.spd);
});
$('speedBtn').addEventListener('click',function(){
  ensureAudio(); snd.click();
  applySpeed(speed%4+1);   /* cycle 1 -> 2 -> 3 -> 4 -> 1 */
});
$('startBtn').addEventListener('click',function(){
  ensureAudio();
  startMusic();
  gen++;
  S=freshState();
  $('startScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');
  $('speedBtn').textContent=SPEED_ICON[speed];
  updateHud(); renderWall();
  ghost.style.display='none';
  car.style.transition='none'; car.style.left='6px';
  void car.offsetWidth; car.style.transition='';
  say('Let\'s dive in, Avery! 🌊');
  later(800,spawn);
});
$('homeBtn').addEventListener('click',function(){
  if(!S) return;
  stopFall();
  stopMusic();
  S.phase='done';
  gen++;
  $('goalOverlay').classList.add('hidden');
  $('gameScreen').classList.add('hidden');
  $('startScreen').classList.remove('hidden');
  showTop();
});
$('muteBtn').addEventListener('click',function(){
  muted=!muted;
  $('muteBtn').textContent=muted?'🔇':'🔊';
  setMusicVolume();
});
$('musicBtn').addEventListener('click',function(){
  ensureAudio();
  musicOn=!musicOn;
  $('musicBtn').classList.toggle('off',!musicOn);
  setMusicVolume();
});
document.addEventListener('keydown',function(e){
  if(S&&S.phase==='falling'&&['1','2','3','4'].indexOf(e.key)>-1){
    answersEl.children[+e.key-1].click();
  }
});
document.addEventListener('visibilitychange',function(){
  if(!S) return;
  if(document.hidden){
    stopMusic();
    if(S.phase==='falling'){
      S.pausedAt=performance.now(); stopFall(); S.phase='paused';
    }
  } else {
    if(S.phase!=='done'&&!$('gameScreen').classList.contains('hidden')) startMusic();
    if(S.phase==='paused'){
      S.fallStart+=performance.now()-S.pausedAt;
      S.phase='falling';
      S.raf=requestAnimationFrame(fall);
    }
  }
});
window.addEventListener('resize',function(){
  if(!S) return;
  renderWall();
  if(S.phase==='falling'||S.phase==='reveal'){
    var m=metrics();
    var bw=Math.min(150,m.W*0.42);
    var cx=S.col*m.cw+m.cw/2;
    fb.style.width=bw+'px';
    fb.style.left=Math.max(4,Math.min(m.W-bw-4,cx-bw/2))+'px';
    ghost.style.left=(S.col*m.cw+2)+'px';
    ghost.style.width=(m.cw-4)+'px';
    ghost.style.height=(m.bh-4)+'px';
    ghost.style.bottom=(S.stacks[S.col].length*m.bh+2)+'px';
  }
});

showTop();
/* reflect saved speed on the start-screen picker and header button */
Array.prototype.forEach.call($('speedPicker').children,function(b){
  b.classList.toggle('on',+b.dataset.spd===speed);
});
$('speedBtn').textContent=SPEED_ICON[speed];
})();
</script>
</body>
</html>
